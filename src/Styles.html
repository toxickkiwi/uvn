<style>
  :root {
    --bg: #f6f7f9;
    --panel: #ffffff;
    --text: #1f2328;
    --muted: #59636e;
    --line: #d8dee4;
    --accent: #2563eb;
    --danger: #c62828;
    --warn-bg: #fff4c2;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text); }
  body { font: 14px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  @media (max-width: 767px) { body { font-size: 16px; } }
  .topbar { display: flex; align-items: center; gap: 16px; padding: 10px 16px; background: var(--panel); border-bottom: 1px solid var(--line); position: sticky; top: 0; z-index: 10; }
  .brand { font-weight: 600; }
  .who { margin-left: auto; color: var(--muted); }
  .main { max-width: 1200px; margin: 0 auto; padding: 16px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 16px; }
  .muted { color: var(--muted); }
  .toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); max-width: calc(100% - 32px); background: #1f2328; color: #fff; padding: 10px 16px; border-radius: 8px; box-shadow: 0 4px 16px rgba(0,0,0,.2); z-index: 100; }
  .toast.error { background: var(--danger); }
</style>
