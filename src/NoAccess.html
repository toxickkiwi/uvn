<!DOCTYPE html>
<html>
  <head>
    <base target="_top">
    <meta charset="utf-8">
    <style>
      body { font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: #1f2328; background: #f6f7f9; margin: 0; }
      .box { max-width: 420px; margin: 15vh auto 0; padding: 24px; background: #fff; border-radius: 10px; box-shadow: 0 1px 3px rgba(0,0,0,.08); }
      h1 { font-size: 20px; margin: 0 0 12px; }
      .email { font-weight: 600; word-break: break-all; }
      .hint { color: #59636e; font-size: 14px; }
    </style>
  </head>
  <body>
    <div class="box">
      <h1>Нет доступа</h1>
      <p>Обратитесь к руководителю.</p>
      <p>Вы вошли как <span class="email"><?= email ?></span></p>
      <p class="hint">Если это не та почта — выйдите из Google и войдите под рабочим аккаунтом.</p>
    </div>
  </body>
</html>
